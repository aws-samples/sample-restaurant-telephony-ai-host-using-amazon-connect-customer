<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Connect Voice Agent — How a Call Works (Step by Step)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg-0: #05070d;
    --bg-1: #0a0f1a;
    --bg-2: #111a2d;
    --grid: rgba(80,120,200,.05);
    --txt: #d7e1f0;
    --txt-dim: #7b8aa5;
    --txt-mute: #4a5669;
    --edge: rgba(120,160,220,.18);
    --edge-hot: rgba(200,230,255,.9);
    --edge-active: #5aa4ff;
    --glass: rgba(20,30,50,.55);
    --glass-brd: rgba(120,180,255,.2);

    --phone: #ffffff;
    --sip: #ff9f43;       /* SIP signaling */
    --audio-in: #22d3ee;  /* caller audio (up) */
    --audio-out: #d946ef; /* Agentic Voice TTS audio (down) */
    --ctrl: #ffffff;      /* WS / auth / handshake */
    --tool: #34d399;      /* MCP + REST tool calls */
    --db: #a78bfa;        /* DynamoDB + Location */
    --prompt: #facc15;    /* prompt renderer path */

    --node-idle: rgba(40,55,85,.85);
    --node-active-brd: #5aa4ff;
    --node-active-bg: rgba(90,164,255,.12);
    --node-active-shadow: 0 0 24px rgba(90,164,255,.45);

    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-0); color: var(--txt); font-family: var(--sans); overflow: hidden; }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(60,120,220,.10), transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(180,60,200,.07), transparent 60%),
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 48px 48px,
      var(--bg-0);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    backdrop-filter: blur(12px);
    background: linear-gradient(180deg, rgba(10,15,26,.85), rgba(10,15,26,.4));
    border-bottom: 1px solid var(--glass-brd);
  }
  header h1 {
    font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .02em;
    display: flex; align-items: center; gap: 10px;
  }
  header h1::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: #22d3ee; box-shadow: 0 0 10px #22d3ee;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .ctrls { display: flex; gap: 10px; align-items: center; }
  .speed-control {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px;
    background: var(--glass);
    border: 1px solid var(--glass-brd);
    border-radius: 8px;
  }
  .speed-control label {
    font: 10px var(--mono); color: var(--txt-dim);
    letter-spacing: .06em; text-transform: uppercase;
    user-select: none;
  }
  .speed-control input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100px; height: 4px;
    background: rgba(120,180,255,.2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .speed-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px;
    background: var(--edge-active);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(90,164,255,.55);
  }
  .speed-control input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px;
    background: var(--edge-active);
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 8px rgba(90,164,255,.55);
  }
  .speed-control .speed-value {
    font: 10px var(--mono); color: var(--txt);
    min-width: 32px; text-align: right;
  }
  button {
    background: var(--glass); color: var(--txt);
    border: 1px solid var(--glass-brd); border-radius: 8px;
    padding: 6px 14px; font: 12px var(--mono);
    cursor: pointer; transition: all .15s;
  }
  button:hover { border-color: var(--edge-active); color: #fff; box-shadow: 0 0 12px rgba(90,164,255,.25); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--edge-active); color: #051021; border-color: var(--edge-active); font-weight: 600; }
  button.primary:hover { background: #76b3ff; }

  main {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: 1fr 320px;
    height: calc(100vh - 48px);
  }

  #stage { position: relative; overflow: hidden; }
  svg.topology { position: absolute; inset: 0; width: 100%; height: 100%; }

  aside {
    border-left: 1px solid var(--glass-brd);
    background: linear-gradient(180deg, rgba(10,15,26,.9), rgba(5,8,15,.85));
    backdrop-filter: blur(10px);
    padding: 16px 18px;
    display: grid;
    grid-template-rows: 3fr 2fr;
    gap: 12px;
    overflow: hidden;
    min-height: 0;
  }

  .panel {
    background: var(--glass);
    border: 1px solid var(--glass-brd);
    border-radius: 10px;
    padding: 14px;
  }
  .panel h2 {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: var(--txt-dim); margin: 0 0 10px 0;
  }

  #stepBox {
    min-height: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #stepBox .step-counter,
  #stepBox .step-title,
  #stepBox #stepNav,
  #stepBox .progress {
    flex: 0 0 auto;
  }
  .step-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  .step-scroll::-webkit-scrollbar { width: 6px; }
  .step-scroll::-webkit-scrollbar-track { background: transparent; }
  .step-scroll::-webkit-scrollbar-thumb { background: rgba(120,180,255,.25); border-radius: 3px; }
  .step-counter {
    font: 11px var(--mono); color: var(--txt-mute);
    margin-bottom: 6px; letter-spacing: .06em;
  }
  .step-title {
    font-size: 18px; font-weight: 700; line-height: 1.25; margin-bottom: 10px;
    color: #fff;
  }
  .step-body {
    font-size: 13px; line-height: 1.55; color: var(--txt);
  }
  .step-body .hl { color: #7ab8ff; font-weight: 600; }
  .step-body code {
    background: rgba(90,164,255,.12); padding: 1px 6px; border-radius: 4px;
    font: 11.5px var(--mono); color: #aee0ff;
  }
  .step-meta {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--glass-brd);
    font: 11px var(--mono); color: var(--txt-dim);
    line-height: 1.5;
  }
  .step-meta .k { color: var(--txt-mute); }
  .step-meta .v { color: var(--txt); }

  #stepNav {
    display: flex; gap: 8px; align-items: center; justify-content: center;
    margin-top: 10px;
  }
  #stepNav button {
    flex: 1 1 auto;
    padding: 8px 0;
    font-size: 14px;
    line-height: 1;
    min-width: 0;
  }
  .progress {
    height: 3px; background: rgba(90,164,255,.12); border-radius: 2px;
    overflow: hidden; margin-top: 8px;
  }
  .progress-inner {
    height: 100%; background: linear-gradient(90deg, var(--edge-active), #76b3ff);
    width: 0; transition: width .35s;
  }

  #allStepsPanel {
    min-height: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .steps-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    margin-top: 2px;
  }
  .steps-list::-webkit-scrollbar { width: 6px; }
  .steps-list::-webkit-scrollbar-track { background: transparent; }
  .steps-list::-webkit-scrollbar-thumb { background: rgba(120,180,255,.25); border-radius: 3px; }
  .step-row {
    display: flex; align-items: start; gap: 8px;
    padding: 6px 8px; border-radius: 6px;
    font-size: 11.5px; line-height: 1.4;
    color: var(--txt-dim); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .step-row:hover { background: rgba(90,164,255,.08); color: var(--txt); }
  .step-row.done { color: var(--txt-mute); }
  .step-row.done .step-row-num { background: rgba(120,180,255,.1); color: var(--txt-mute); }
  .step-row.active {
    background: rgba(90,164,255,.14); color: #fff;
  }
  .step-row.active .step-row-num { background: var(--edge-active); color: #051021; }
  .step-row-num {
    flex: 0 0 22px; height: 22px; border-radius: 4px;
    background: rgba(120,180,255,.1); color: var(--txt-dim);
    font: 600 10px var(--mono); text-align: center; line-height: 22px;
  }

  #nodeLayer {
    position: absolute; inset: 0; pointer-events: none;
  }
  .node-box {
    position: absolute; pointer-events: auto;
    background: var(--node-idle);
    border: 1px solid rgba(120,180,255,.18);
    border-radius: 10px;
    padding: 10px 8px;
    backdrop-filter: blur(8px);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-align: center;
    transition: border-color .35s, background .35s, box-shadow .35s, transform .35s;
  }
  .node-box.active {
    border-color: var(--node-active-brd);
    background: var(--node-active-bg);
    box-shadow: var(--node-active-shadow);
    transform: translate(-50%, -50%) scale(1.04);
  }
  .node-box.dim { opacity: .35; }
  .node-icon { flex: 0 0 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
  .node-icon svg { width: 32px; height: 32px; }
  .node-text { line-height: 1.25; width: 100%; }
  .node-title { font-size: 11px; font-weight: 600; color: #fff; letter-spacing: .01em; }
  .node-sub { font-size: 9px; color: var(--txt-dim); font-family: var(--mono); margin-top: 1px; }
  .node-sub b { color: #7ab8ff; font-weight: 500; }

  .cluster-label {
    font: 600 11px var(--sans);
    fill: rgba(180,210,255,.55);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .edge-base {
    fill: none; stroke-width: 1.4;
    stroke-dasharray: 4 5;
    opacity: .45;
    transition: opacity .35s, stroke-width .35s;
  }
  .edge-base.live { opacity: 0; }
  .edge-hot {
    stroke-width: 2.2; fill: none;
    opacity: 0;
    transition: opacity .35s;
  }
  .edge-hot.on {
    opacity: .95;
    filter: drop-shadow(0 0 6px currentColor);
  }

  .packet { filter: drop-shadow(0 0 8px currentColor); }

  .node-tooltip {
    position: absolute;
    background: rgba(15,25,45,.96);
    border: 1px solid rgba(120,180,255,.3);
    border-radius: 6px;
    padding: 8px 10px;
    font: 11.5px var(--sans); color: var(--txt);
    max-width: 220px; pointer-events: none;
    opacity: 0; transform: translateY(4px);
    transition: opacity .15s, transform .15s;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .node-tooltip.show { opacity: 1; transform: translateY(0); }
  .node-tooltip .tooltip-title { font-weight: 700; color: #fff; margin-bottom: 3px; }

  .port-badge {
    position: absolute;
    background: rgba(90,164,255,.2);
    border: 1px solid rgba(90,164,255,.5);
    color: #aee0ff;
    font: 9.5px var(--mono);
    padding: 2px 6px; border-radius: 3px;
    pointer-events: none;
    opacity: 0; transition: opacity .35s;
    white-space: nowrap;
  }
  .port-badge.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Connect Voice Agent &mdash; How a Call Works</h1>
  <div class="ctrls">
    <div class="speed-control" title="Auto-play speed">
      <label for="speedSlider">Speed</label>
      <input type="range" id="speedSlider" min="1" max="10" value="3" step="1" />
      <span class="speed-value" id="speedValue">1.0&times;</span>
    </div>
    <button id="autoPlay">Auto-play</button>
    <button id="restart">Restart</button>
  </div>
</header>

<main>
  <section id="stage">
    <svg class="topology" id="svg" viewBox="0 0 1170 800" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="rgba(200,230,255,.75)" />
        </marker>
      </defs>
      <g id="clusters"></g>
      <g id="edgesBase"></g>
      <g id="edgesHot"></g>
      <g id="packets"></g>
    </svg>
    <div id="nodeLayer"></div>
  </section>

  <aside>
    <div class="panel" id="stepBox">
      <div class="step-counter" id="stepCounter">STEP 0 OF 9</div>
      <div class="step-title" id="stepTitle">Welcome</div>
      <div class="step-scroll">
        <div class="step-body" id="stepBody">Choose <b>Next</b> to start walking through what happens when a customer calls the restaurant.</div>
        <div class="step-meta" id="stepMeta"></div>
      </div>
      <div id="stepNav">
        <button id="jumpStart" title="First step">&#x23EE;</button>
        <button id="prevStep" title="Previous step">&#x25C4;</button>
        <button id="nextStep" class="primary" title="Next step">&#x25BA;</button>
        <button id="jumpEnd" title="Last step">&#x23ED;</button>
      </div>
      <div class="progress"><div class="progress-inner" id="progressInner"></div></div>
    </div>

    <div class="panel" id="allStepsPanel">
      <h2>All Steps</h2>
      <div class="steps-list" id="stepsList"></div>
    </div>
  </aside>
</main>

<div class="node-tooltip" id="tooltip"></div>

<script>

const NODES = {
  caller:    { x:  15, y: 340, w: 140, h: 78, label: 'Phone Customer',         sub: 'Inbound call',                         icon: 'phone' },
  connect:   { x: 175, y: 340, w: 140, h: 78, label: 'Amazon Connect',          sub: 'Contact Flow',                         icon: 'chime' },
  lex:       { x: 335, y: 340, w: 140, h: 78, label: 'Amazon Lex V2',           sub: 'Agentic Voice \u00b7 Advanced ASR',     icon: 'bedrock' },
  agent:     { x: 495, y: 260, w: 140, h: 78, label: 'Connect AI Agent',        sub: 'ORCHESTRATION \u00b7 Claude Haiku 4.5', icon: 'agentcore' },
  claude:    { x: 495, y: 420, w: 140, h: 78, label: 'Amazon Bedrock',          sub: 'Claude Haiku 4.5',                     icon: 'bedrock' },
  mcpGw:     { x: 655, y: 340, w: 140, h: 78, label: 'AgentCore Gateway',       sub: 'MCP \u00b7 CUSTOM_JWT',                 icon: 'agentcore' },
  apiGw:     { x: 815, y: 260, w: 140, h: 78, label: 'API Gateway',             sub: 'REST \u00b7 AWS_IAM \u00b7 prod',       icon: 'apigw' },
  lambdas:   { x: 815, y: 420, w: 140, h: 78, label: 'AWS Lambda',              sub: '10 \u00d7 GetMenu, Cart, Order\u2026',  icon: 'lambda' },
  ddb:       { x: 975, y: 260, w: 185, h: 78, label: 'Amazon DynamoDB',         sub: 'Menu \u00b7 Orders \u00b7 Carts',       icon: 'dynamodb' },
  location:  { x: 975, y: 420, w: 185, h: 78, label: 'Amazon Location',         sub: 'Geocode \u00b7 Nearest search',         icon: 'location' },
};

const CLUSTERS = [
  { label: 'CALLER',              x:  10, y: 50, w: 150, h: 660, color: '#ff9f43' },
  { label: 'Amazon Connect',      x: 170, y: 50, w: 150, h: 660, color: '#dd344c' },
  { label: 'Amazon Lex V2',       x: 330, y: 50, w: 150, h: 660, color: '#22d3ee' },
  { label: 'Connect AI Agents',   x: 490, y: 50, w: 150, h: 660, color: '#d946ef' },
  { label: 'MCP Gateway',         x: 650, y: 50, w: 150, h: 660, color: '#34d399' },
  { label: 'API & Compute',       x: 810, y: 50, w: 150, h: 660, color: '#a78bfa' },
  { label: 'Data Storage',        x: 970, y: 50, w: 200, h: 660, color: '#4d72f3' },
];

const EDGES = [
  { id: 'caller-connect',   from: 'caller',   to: 'connect',  curve:   0, color: 'var(--sip)' },
  { id: 'connect-agent',   from: 'connect',  to: 'agent',    curve: -80, color: 'var(--ctrl)' },
  { id: 'connect-lex',     from: 'connect',  to: 'lex',      curve:   0, color: 'var(--audio-in)' },
  { id: 'lex-agent',       from: 'lex',      to: 'agent',    curve:   0, color: 'var(--ctrl)' },
  { id: 'agent-claude',    from: 'agent',    to: 'claude',   curve:   0, color: 'var(--prompt)' },
  { id: 'agent-mcp',       from: 'agent',    to: 'mcpGw',    curve:   0, color: 'var(--tool)' },
  { id: 'mcp-api',         from: 'mcpGw',    to: 'apiGw',    curve:   0, color: 'var(--tool)' },
  { id: 'api-lambdas',     from: 'apiGw',    to: 'lambdas',  curve:   0, color: 'var(--tool)' },
  { id: 'lambdas-ddb',     from: 'lambdas',  to: 'ddb',      curve:   0, color: 'var(--db)' },
  { id: 'lambdas-location',from: 'lambdas',  to: 'location', curve:  30, color: 'var(--db)' },
  // Return path (pink) — tool result flows back to caller
  { id: 'lambdas-api-ret', from: 'lambdas',  to: 'apiGw',    curve:  40, color: 'var(--audio-out)' },
  { id: 'api-mcp-ret',     from: 'apiGw',    to: 'mcpGw',    curve:  40, color: 'var(--audio-out)' },
  { id: 'mcp-agent-ret',   from: 'mcpGw',    to: 'agent',    curve:  40, color: 'var(--audio-out)' },
  { id: 'agent-lex-ret',   from: 'agent',    to: 'lex',      curve:  50, color: 'var(--audio-out)' },
  { id: 'lex-connect-ret', from: 'lex',      to: 'connect',  curve:  40, color: 'var(--audio-out)' },
  { id: 'connect-caller-ret', from: 'connect', to: 'caller', curve:  40, color: 'var(--audio-out)' },
];

const STEPS = [
  {
    title: 'Customer dials the restaurant',
    body: 'A customer dials the phone number provisioned by <span class="hl">Amazon Connect</span>. The call arrives at the Connect instance and enters the contact flow immediately.',
    meta: { Service: 'Amazon Connect', 'Phone type': 'DID or Toll-Free', Region: 'us-east-1' },
    nodes: ['caller', 'connect'],
    edges: [{ edge: 'caller-connect', kind: 'sip' }],
    packets: [{ edge: 'caller-connect', kind: 'sip', count: 2 }],
  },
  {
    title: 'Contact Flow opens the Amazon Connect AI Agents session',
    body: 'The <span class="hl">Contact Flow</span> sets the Agentic Voice, captures the caller ANI, calls <code>CreateWisdomSession</code> to open a session with the <span class="hl">Amazon Connect AI Agent</span>, stores the session ARN, invokes a Lambda that pushes the caller phone number into the session via <code>UpdateSessionData</code>, and plays the greeting: <i>"Thank you for calling, give me a moment to connect."</i>',
    meta: { Block1: 'UpdateContactTextToSpeechVoice \u2192 connect:agentic', Block2: 'UpdateContactAttributes \u2192 callerPhoneNumber', Block3: 'CreateWisdomSession \u2192 Connect AI Agent', Block4: 'InvokeLambdaFunction \u2192 UpdateSessionData (Custom.callerPhoneNumber)', Block5: 'ConnectParticipantWithLexBot' },
    nodes: ['connect', 'agent'],
    edges: [{ edge: 'connect-agent', kind: 'ctrl' }],
    packets: [{ edge: 'connect-agent', kind: 'ctrl', count: 1 }],
  },
  {
    title: 'Contact Flow hands call to Amazon Lex V2',
    body: 'The Contact Flow connects the caller to the <span class="hl">Amazon Lex V2 bot</span> via the <code>ConnectParticipantWithLexBot</code> block. The Lex bot provides the real-time speech layer using <span class="hl">Amazon Connect Agentic Voice</span> \u2014 Advanced ASR listens and detects end-of-turn, and Agentic Voice TTS speaks the reply.',
    meta: { ASR: 'Agentic Voice (Advanced)', TTS: 'connect:agentic \u00b7 KATIE', Intent: 'AMAZON.QInConnectIntent', 'Session TTL': '300s' },
    nodes: ['connect', 'lex'],
    edges: [{ edge: 'connect-lex', kind: 'audioIn' }],
    packets: [{ edge: 'connect-lex', kind: 'audioIn', count: 2 }],
  },
  {
    title: 'Lex routes conversation to the ORCHESTRATION AI Agent',
    body: 'The <code>AMAZON.QInConnectIntent</code> routes all conversation turns to the <span class="hl">Amazon Connect ORCHESTRATION AI Agent</span>. Lex with Agentic Voice handles the speech layer; the AI Agent handles all reasoning and tool calls. An <span class="hl">AI Guardrail</span> screens every turn for harmful or off-topic content.',
    meta: { Intent: 'AMAZON.QInConnectIntent', 'Agent type': 'ORCHESTRATION', Guardrail: 'OrchestrationAIGuardrailId (content filters, denied topics, profanity)' },
    nodes: ['lex', 'agent'],
    edges: [{ edge: 'lex-agent', kind: 'ctrl' }],
    packets: [{ edge: 'lex-agent', kind: 'ctrl', count: 1 }],
  },
  {
    title: 'AI Agent reasons with Claude Haiku 4.5',
    body: 'The <span class="hl">ORCHESTRATION AI Agent</span> uses <span class="hl">Claude Haiku 4.5</span> (model ID <code>us.anthropic.claude-haiku-4-5-20251001-v1:0</code>) to understand the caller\'s intent. It greets the caller, asks for their location if needed, and decides which tools to call.',
    meta: { Model: 'Claude Haiku 4.5', 'Model ID': 'us.anthropic.claude-haiku-4-5-20251001-v1:0', Format: 'ORCHESTRATION / MESSAGES', Language: 'English' },
    nodes: ['agent', 'claude'],
    edges: [{ edge: 'agent-claude', kind: 'prompt' }],
    packets: [{ edge: 'agent-claude', kind: 'prompt', count: 1 }],
  },
  {

const ICON_LABELS = {
  phone: 'Phone caller',
  chime: 'Amazon Connect',
  lambda: 'AWS Lambda',
  dynamodb: 'Amazon DynamoDB',
  apigw: 'Amazon API Gateway',
  elb: 'Network Load Balancer',
  fargate: 'AWS Fargate',
  bedrock: 'Amazon Bedrock',
  agentcore: 'Amazon Bedrock AgentCore',
  ssm: 'AWS Systems Manager',
  location: 'Amazon Location Service',
};

function renderIcon(iconKey) {
  const svg = ICONS[iconKey] || '';
  if (!svg) return '';
  const label = ICON_LABELS[iconKey] || 'icon';
  return svg
    .replace('<svg ', `<svg role="img" aria-label="${label}" `)
    .replace('>', `><title>${label}</title>`);
}

const PACKET_COLORS = {
  sip:      'var(--sip)',
  audioIn:  'var(--audio-in)',
  audioOut: 'var(--audio-out)',
  ctrl:     'var(--ctrl)',
  tool:     'var(--tool)',
  db:       'var(--db)',
  prompt:   'var(--prompt)',
};

const svg = document.getElementById('svg');
const clustersG = document.getElementById('clusters');
const edgesBaseG = document.getElementById('edgesBase');
const edgesHotG = document.getElementById('edgesHot');
const packetsG = document.getElementById('packets');
const nodeLayer = document.getElementById('nodeLayer');
const tooltipEl = document.getElementById('tooltip');

function nodeCenter(n) { return { x: n.x + n.w / 2, y: n.y + n.h / 2 }; }

function svgToScreen(x, y) {
  const stage = document.getElementById('stage');
  const rect = stage.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const scale = Math.min(rect.width / vb.width, rect.height / vb.height);
  const offX = (rect.width - vb.width * scale) / 2;
  const offY = (rect.height - vb.height * scale) / 2;
  return {
    x: x * scale + offX,
    y: y * scale + offY,
    scale,
  };
}

for (const c of CLUSTERS) {
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', c.x); rect.setAttribute('y', c.y);
  rect.setAttribute('width', c.w); rect.setAttribute('height', c.h);
  rect.setAttribute('rx', 12);
  rect.setAttribute('fill', c.color);
  rect.setAttribute('fill-opacity', 0.04);
  rect.setAttribute('stroke', c.color);
  rect.setAttribute('stroke-opacity', 0.35);
  rect.setAttribute('stroke-dasharray', '4 6');
  rect.setAttribute('stroke-width', 1);
  clustersG.appendChild(rect);

  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', c.x + 14);
  label.setAttribute('y', c.y + 22);
  label.setAttribute('class', 'cluster-label');
  label.setAttribute('fill', c.color);
  label.setAttribute('fill-opacity', 0.55);
  label.textContent = c.label;
  clustersG.appendChild(label);
}

function edgePath(from, to, curve) {
  const a = nodeCenter(NODES[from]);
  const b = nodeCenter(NODES[to]);
  const mx = (a.x + b.x) / 2;
  const my = (a.y + b.y) / 2 + curve;
  return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
}

const edgeHotElements = {};
const edgeBaseElements = {};
for (const e of EDGES) {
  const d = edgePath(e.from, e.to, e.curve);
  const base = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  base.setAttribute('d', d);
  base.setAttribute('class', 'edge-base');
  base.setAttribute('stroke', e.color);
  base.setAttribute('id', `edge-base-${e.id}`);
  base.style.color = e.color;
  edgesBaseG.appendChild(base);
  edgeBaseElements[e.id] = base;

  const hot = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  hot.setAttribute('d', d);
  hot.setAttribute('class', 'edge-hot');
  hot.setAttribute('id', `edge-hot-${e.id}`);
  hot.setAttribute('stroke', e.color);
  hot.style.color = e.color;
  hot.setAttribute('marker-end', 'url(#arrow)');
  edgesHotG.appendChild(hot);
  edgeHotElements[e.id] = hot;
}

const nodeElements = {};
function renderNodes() {
  nodeLayer.innerHTML = '';
  for (const [key, n] of Object.entries(NODES)) {
    const pos = svgToScreen(n.x + n.w / 2, n.y + n.h / 2);
    const el = document.createElement('div');
    el.className = 'node-box';
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    el.style.transform = 'translate(-50%, -50%)';
    el.innerHTML = `
      <div class="node-icon">${renderIcon(n.icon)}</div>
      <div class="node-text">
        <div class="node-title">${n.label}</div>
        <div class="node-sub">${n.sub}</div>
      </div>
    `;
    el.addEventListener('mouseenter', (ev) => showTooltip(ev, key, n));
    el.addEventListener('mousemove', (ev) => moveTooltip(ev));
    el.addEventListener('mouseleave', () => hideTooltip());
    nodeLayer.appendChild(el);
    nodeElements[key] = el;
  }
}

function showTooltip(ev, key, node) {
  tooltipEl.innerHTML = `<div class="tooltip-title">${node.label}</div><div>${node.sub.replace(/<[^>]*>/g, '')}</div>`;
  tooltipEl.classList.add('show');
  moveTooltip(ev);
}
function moveTooltip(ev) {
  tooltipEl.style.left = (ev.clientX + 14) + 'px';
  tooltipEl.style.top = (ev.clientY + 14) + 'px';
}
function hideTooltip() { tooltipEl.classList.remove('show'); }

function firePacket(edgeId, kindColor, durationMs) {
  const pathEl = edgeHotElements[edgeId];
  if (!pathEl) return;
  const pathD = pathEl.getAttribute('d');

  const measure = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  measure.setAttribute('d', pathD);
  measure.style.visibility = 'hidden';
  svg.appendChild(measure);
  const total = measure.getTotalLength();

  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('r', 5);
  dot.setAttribute('fill', kindColor);
  dot.setAttribute('class', 'packet');
  dot.style.color = kindColor;
  packetsG.appendChild(dot);

  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / durationMs);
    const p = measure.getPointAtLength(t * total);
    dot.setAttribute('cx', p.x);
    dot.setAttribute('cy', p.y);
    if (t < 1) requestAnimationFrame(tick);
    else {
      dot.remove();
      measure.remove();
    }
  }
  requestAnimationFrame(tick);
}

let currentStep = -1;
let autoPlayTimer = null;
let autoPlaying = false;
const BASE_AUTOPLAY_MS = 3500;
function currentSpeedMultiplier() {
  const slider = document.getElementById('speedSlider');
  return slider ? Number(slider.value) / 3 : 1;
}
function currentAutoplayMs() {
  return Math.max(400, Math.round(BASE_AUTOPLAY_MS / currentSpeedMultiplier()));
}

function applyStep(idx) {
  currentStep = idx;
  const step = STEPS[idx];

  document.getElementById('stepCounter').textContent = `STEP ${idx + 1} OF ${STEPS.length}`;
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepBody').innerHTML = step.body;

  const metaEl = document.getElementById('stepMeta');
  metaEl.innerHTML = Object.entries(step.meta || {})
    .map(([k, v]) => `<span class="k">${k}</span> <span class="v">${v}</span>`)
    .join('<br/>');

  document.getElementById('progressInner').style.width = ((idx + 1) / STEPS.length * 100) + '%';

  let activeRow = null;
  for (const row of document.querySelectorAll('.step-row')) {
    const rowIdx = Number(row.dataset.idx);
    row.classList.toggle('active', rowIdx === idx);
    row.classList.toggle('done', rowIdx < idx);
    if (rowIdx === idx) activeRow = row;
  }
  if (activeRow) {
    activeRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  const activeSet = new Set(step.nodes);
  for (const [key, el] of Object.entries(nodeElements)) {
    el.classList.toggle('active', activeSet.has(key));
  }

  const activeEdges = new Set((step.edges || []).map((e) => e.edge));
  for (const [id, el] of Object.entries(edgeHotElements)) {
    el.classList.toggle('on', activeEdges.has(id));
  }
  for (const [id, el] of Object.entries(edgeBaseElements)) {
    el.classList.toggle('live', activeEdges.has(id));
  }

  for (const p of step.packets || []) {
    const count = p.count || 1;
    const spread = p.spread || 0;
    const baseDelay = p.delay || 0;
    const dur = 1200;
    for (let i = 0; i < count; i++) {
      setTimeout(() => firePacket(p.edge, PACKET_COLORS[p.kind] || '#fff', dur),
        baseDelay + (i * (spread / Math.max(1, count))));
    }
  }

  document.getElementById('prevStep').disabled = (idx === 0);
  document.getElementById('nextStep').disabled = (idx === STEPS.length - 1);
}

function buildStepsList() {
  const list = document.getElementById('stepsList');
  list.innerHTML = '';
  STEPS.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'step-row';
    row.dataset.idx = i;
    row.innerHTML = `<div class="step-row-num">${String(i + 1).padStart(2, '0')}</div><div>${s.title}</div>`;
    row.addEventListener('click', () => { stopAutoPlay(); applyStep(i); });
    list.appendChild(row);
  });
}

function startAutoPlay() {
  autoPlaying = true;
  document.getElementById('autoPlay').innerHTML = 'Pause';
  if (currentStep < STEPS.length - 1) {
    applyStep(currentStep + 1);
  }
  autoPlayTimer = setInterval(() => {
    if (currentStep >= STEPS.length - 1) {
      stopAutoPlay();
      return;
    }
    applyStep(currentStep + 1);
  }, currentAutoplayMs());
}
function stopAutoPlay() {
  autoPlaying = false;
  document.getElementById('autoPlay').innerHTML = 'Auto-play';
  if (autoPlayTimer) { clearInterval(autoPlayTimer); autoPlayTimer = null; }
}
function reapplyAutoplayInterval() {
  if (!autoPlaying || !autoPlayTimer) return;
  clearInterval(autoPlayTimer);
  autoPlayTimer = setInterval(() => {
    if (currentStep >= STEPS.length - 1) {
      stopAutoPlay();
      return;
    }
    applyStep(currentStep + 1);
  }, currentAutoplayMs());
}

document.getElementById('prevStep').addEventListener('click', () => {
  stopAutoPlay();
  if (currentStep > 0) applyStep(currentStep - 1);
});
document.getElementById('nextStep').addEventListener('click', () => {
  stopAutoPlay();
  if (currentStep < STEPS.length - 1) applyStep(currentStep + 1);
});
document.getElementById('jumpStart').addEventListener('click', () => { stopAutoPlay(); applyStep(0); });
document.getElementById('jumpEnd').addEventListener('click', () => { stopAutoPlay(); applyStep(STEPS.length - 1); });
document.getElementById('restart').addEventListener('click', () => { stopAutoPlay(); applyStep(0); });
document.getElementById('autoPlay').addEventListener('click', () => {
  if (autoPlaying) stopAutoPlay();
  else {
    if (currentStep >= STEPS.length - 1) applyStep(0);
    startAutoPlay();
  }
});

(function initSpeedSlider() {
  const slider = document.getElementById('speedSlider');
  const valueEl = document.getElementById('speedValue');
  if (!slider || !valueEl) return;
  const update = () => {
    const m = currentSpeedMultiplier();
    valueEl.textContent = m.toFixed(1).replace(/\.0$/, '') + '\u00d7';
    reapplyAutoplayInterval();
  };
  slider.addEventListener('input', update);
  update();
})();

window.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight' || ev.key === ' ') {
    ev.preventDefault();
    stopAutoPlay();
    if (currentStep < STEPS.length - 1) applyStep(currentStep + 1);
  } else if (ev.key === 'ArrowLeft') {
    ev.preventDefault();
    stopAutoPlay();
    if (currentStep > 0) applyStep(currentStep - 1);
  }
});

window.addEventListener('resize', () => renderNodes());

renderNodes();
buildStepsList();
applyStep(0);
</script>
