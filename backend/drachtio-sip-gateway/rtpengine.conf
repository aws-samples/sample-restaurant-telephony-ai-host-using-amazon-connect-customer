[rtpengine]
# table = -1 runs rtpengine in pure user-space mode. Required on Fargate
# because containers cannot load the rtpengine-ng kernel module.
table = -1

# Two named logical interfaces — per rtpengine config-file semantics,
# multiple interfaces are listed as a single `interface = ...` line
# with semicolon-separated values (one `interface =` line per value
# gets ignored all but the last one).
#   - "pub" binds on the task's ENI primary IP, advertises the NLB
#     public IP in SDP. This is the Chime-facing side.
#   - "lo"  binds on 127.0.0.1 and advertises 127.0.0.1.  This is the
#     Node-bridge-facing side.
# The entrypoint substitutes ${LOCAL_IP} with <private_ip>!<public_ip>
# via sed at startup.
interface = pub/${LOCAL_IP};lo/127.0.0.1

# NG control protocol (the npm `rtpengine-client` talks to this). Loopback
# only so nothing outside the container can issue offer/answer/delete.
listen-ng = 127.0.0.1:2223

# Caller-facing RTP port range. 49 ports fits under the NLB 50-listener
# cap (one TCP listener for SIP 5060 plus 49 UDP listeners for RTP).
# Both interfaces share this range since the port numbers don't conflict
# across different bind addresses.
port-min = 16000
port-max = 16048

# Run in foreground so tini can supervise it. stderr logging is captured
# by the Fargate awslogs driver.
foreground = true
log-stderr = true
log-level = 6

# TOS byte on outbound RTP = 184 (EF, DSCP 46) — standard for VoIP media.
tos = 184

# Don't delay freeing resources after a call teardown; keeps our port
# pool tight.
delete-delay = 0
