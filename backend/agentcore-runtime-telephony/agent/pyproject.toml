# Agent-side test configuration.
# No packaging block — the agent is a container image, not a pip-installable
# package. This file only carries pytest configuration.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "property: property-based test (hypothesis)",
]
# Hypothesis defaults: keep sessions short so CI does not time out.
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
